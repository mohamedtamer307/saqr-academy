<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة المتدرب | SAQR Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>body{background:#050505;color:#fff;font-family:Arial,Tahoma,sans-serif}.glass{background:#111;border:1px solid rgba(255,255,255,.08)}.card{transition:.25s}.card:hover{transform:translateY(-4px);border-color:rgba(225,6,0,.5)}</style>
</head>
<body>
<header class="border-b border-white/10 bg-black/90 sticky top-0 z-40">
<nav class="max-w-7xl mx-auto px-5 h-20 flex items-center justify-between">
<a href="#" class="flex items-center gap-3"><img src="assets/saqr-logo.jpg" class="w-12 h-12 rounded-xl object-cover"><b>SAQR ACADEMY</b></a>
<div class="flex items-center gap-3"><span id="userName" class="hidden sm:block text-sm text-gray-400"></span><button id="logout" class="px-4 py-2 rounded-lg border border-white/10 text-sm">تسجيل الخروج</button></div>
</nav></header>
<main class="max-w-7xl mx-auto px-5 py-10">
<div class="mb-9"><p class="text-[#e10600] text-xs font-black">MY TRAINING</p><h1 class="text-4xl sm:text-5xl font-black mt-2">لوحة التدريب</h1><p class="text-gray-500 mt-3">تابع تقدمك واستكمل تدريباتك من حيث توقفت.</p></div>
<div id="alert" class="hidden mb-6 p-4 rounded-xl border border-yellow-500/20 bg-yellow-500/5 text-yellow-300 text-sm"></div>
<div class="mb-8"><a href="plans.html" class="inline-flex bg-red-600 hover:bg-red-700 px-5 py-3 rounded-xl font-black">اختيار / تغيير الباقة</a></div>
<section class="grid md:grid-cols-3 gap-5 mb-10">
<div class="glass rounded-2xl p-6"><p class="text-gray-500 text-sm">الباقة الحالية</p><h2 id="plan" class="text-2xl font-black mt-2">غير مشترك</h2><p id="status" class="text-[#ff4b45] text-sm mt-2">—</p></div>
<div class="glass rounded-2xl p-6"><p class="text-gray-500 text-sm">تاريخ الانتهاء</p><h2 id="expires" class="text-2xl font-black mt-2">—</h2></div>
<div class="glass rounded-2xl p-6"><p class="text-gray-500 text-sm">الكورسات المتاحة</p><h2 id="courseCount" class="text-2xl font-black mt-2">0</h2></div>
</section>
<section><div class="mb-6"><p class="text-[#e10600] text-xs font-black">MY COURSES</p><h2 class="text-3xl font-black mt-2">الكورسات المتاحة</h2></div><div id="courses" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div></section>
</main>
<script>
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function init(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){location.href='login.html';return;}
 document.getElementById('userName').textContent='أهلاً، '+(user.user_metadata?.full_name||user.email)+' 👋';

 const {data:profile}=await supabaseClient.from('profiles').select('account_status').eq('id',user.id).single();
 if(profile?.account_status==='suspended'){document.getElementById('alert').textContent='حسابك متوقف حالياً. تواصل مع إدارة الأكاديمية.';document.getElementById('alert').classList.remove('hidden');return;}
 const {data:subs}=await supabaseClient.from('subscriptions').select('*, plans(name,slug,price,currency)').eq('user_id',user.id).order('created_at',{ascending:false}).limit(5);
 const active=(subs||[]).find(s=>s.status==='active'&&s.ends_at&&new Date(s.ends_at)>new Date());
 const pending=(subs||[]).find(s=>s.status==='pending');
 const sub=active;
 if(!sub){
   document.getElementById('alert').textContent=pending?'طلبك للباقة '+(pending.plans?.name||'')+' قيد المراجعة. بعد تأكيد الحوالة سيتم تفعيل الحساب.':'لا يوجد اشتراك نشط حالياً. اختر باقة للمتابعة إلى الدفع.';
   document.getElementById('alert').classList.remove('hidden');
   if(pending) document.getElementById('plan').textContent=pending.plans?.name||'قيد المراجعة';
   else document.getElementById('plan').textContent='غير مشترك';
   return;
 }
 document.getElementById('plan').textContent=sub.plans?.name||'PRO';
 document.getElementById('status').textContent='اشتراك نشط';
 document.getElementById('expires').textContent=new Date(sub.ends_at).toLocaleDateString('ar-SA');

 const {data:links}=await supabaseClient.from('plan_courses').select('course_id').eq('plan_id',sub.plan_id);
 const ids=(links||[]).map(x=>x.course_id);
 if(!ids.length)return;
 const {data:courses,error}=await supabaseClient.from('courses').select('*').in('id',ids).eq('is_active',true);
 if(error){console.error(error);return;}
 document.getElementById('courseCount').textContent=courses.length;
 document.getElementById('courses').innerHTML=courses.map((c,i)=>`
 <article class="glass rounded-2xl overflow-hidden card">
   <div class="h-40 bg-gradient-to-br from-[#e10600]/30 to-black flex items-center justify-center text-6xl">${['🥊','👊','🛡️','🔥'][i%4]}</div>
   <div class="p-6"><span class="text-xs text-[#ff4b45] font-bold">${escapeHtml(c.level||'TRAINING')}</span>
   <h3 class="text-xl font-black mt-2">${escapeHtml(c.title)}</h3>
   <p class="text-gray-500 text-sm mt-2">${escapeHtml(c.description||'')}</p>
   <button onclick="openCourse('${c.id}')" class="mt-5 w-full py-3 rounded-xl bg-[#e10600] font-black">فتح الكورس</button></div>
 </article>`).join('');
}
async function openCourse(courseId){
  location.href='course.html?id='+encodeURIComponent(courseId);
}
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='index.html';};
init();
</script>
